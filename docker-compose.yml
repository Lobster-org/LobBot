name: lobbot

services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-lobadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-lobbot}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok" | grep 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: lobbot:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}
      MONGO_URI: ${DOCKER_MONGO_URI:?Set DOCKER_MONGO_URI in .env}
      MONGO_DATABASE: ${MONGO_DATABASE:-lobbot}
      REDIS_URI: ${REDIS_URI:-redis://unused:6379/0}
      VOICE_SESSION_NAME: /app/data/sessions/lobbot_voice
      MUSIC_STORAGE_PATH: /app/storage/music
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - voice_sessions:/app/data/sessions
      - music_cache:/app/storage/music
      - bot_logs:/app/logs
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  mongodb_data:
  voice_sessions:
  music_cache:
  bot_logs:
